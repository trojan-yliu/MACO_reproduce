# Environment for redrawing the MACO figures in this folder.
# Separate from maco_env. It does not install MACO, Flye, or Infomap.
# Versions are pinned to the ones used to draw the figures.
#   conda env create -f maco_reproduce.yaml
name: maco_reproduce
channels:
  - conda-forge
dependencies:
  - python=3.13.5
  - matplotlib=3.10.0
  - numpy=2.1.3
  - pandas=2.2.3
  - openpyxl=3.1.5
